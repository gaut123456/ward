<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" />
  <title>Ward</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="widget-body">
  <main class="widget" data-phase="Disconnected">
    <header class="header drag-handle">
      <span id="queue-badge" class="queue-badge"><button id="queue-button" class="queue-button" aria-label="Changer de file" title="Changer de file" aria-haspopup="dialog" aria-controls="queue-panel" aria-expanded="false" disabled><i class="badge-gem" aria-hidden="true"></i><span id="queue-label" class="badge-label">Solo / Duo</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><span id="feedback" class="feedback" role="status" title="">Connexion…</span></span>
      <time id="queue-timer" class="queue-timer" aria-label="Temps de recherche" role="timer" hidden>0:00</time>
      <div class="header-actions">
        <button id="open-client" aria-label="Ouvrir le client League" title="Ouvrir le client League" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M10 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-4"/></svg>
        </button>
        <button id="close-widget" aria-label="Fermer" title="Fermer">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
        </button>
      </div>
    </header>

    <div id="invite-toast" class="invite-toast drag-handle" role="alert" hidden>
      <span class="invite-avatar"><img id="invite-avatar" alt="" hidden /></span>
      <span class="invite-text"><b id="invite-name"></b> t’invite · <span id="invite-queue" class="invite-queue"></span></span>
      <span id="invite-more" class="invite-more" hidden></span>
      <button id="invite-decline" class="invite-decline" aria-label="Refuser l'invitation" title="Refuser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      <button id="invite-accept" class="invite-accept" aria-label="Rejoindre le lobby" title="Rejoindre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>

    <div id="players" class="players">
      <div class="profile player" id="profile" title="Connexion à League…">
        <div class="portrait-frame">
          <div class="portrait">
            <img id="avatar" alt="Photo de profil" hidden />
            <svg id="avatar-fallback" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="18" r="8"/><path d="M9 44v-4a15 15 0 0 1 30 0v4"/></svg>
          </div>
          <i id="connection-dot" class="connection-dot"></i>
          <span id="level" class="level" hidden></span>
        </div>
        <strong id="summoner-name" class="player-name">—</strong>
        <div class="role-slots" aria-label="Mes rôles">
          <button id="primary-role" class="role-slot" aria-label="Choisir le rôle principal" title="Rôle principal" aria-expanded="false" aria-controls="roles-panel"><img src="assets/roles/unselected.png" alt="" /></button>
          <button id="secondary-role" class="role-slot secondary-slot" aria-label="Choisir le rôle secondaire" title="Rôle secondaire" aria-expanded="false" aria-controls="roles-panel"><img src="assets/roles/unselected.png" alt="" /></button>
        </div>
      </div>

      <div class="link" aria-hidden="true"><i></i></div>

      <div class="duo-slot player" id="duo-slot" title="Duo partenaire">
        <div class="portrait-frame">
          <div class="portrait" id="duo-portrait" hidden>
            <img id="duo-avatar" alt="Photo de profil du partenaire" hidden />
            <svg id="duo-avatar-fallback" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="18" r="8"/><path d="M9 44v-4a15 15 0 0 1 30 0v4"/></svg>
          </div>
          <button id="add-friend" class="add-friend" aria-label="Inviter un ami" aria-expanded="false" title="Inviter un ami"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button>
          <button id="kick-friend" class="kick-friend" aria-label="Exclure le partenaire du lobby" title="Exclure le partenaire du lobby" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l8 8M16 8l-8 8"/></svg>
          </button>
          <span id="duo-level" class="level" hidden></span>
        </div>
        <strong id="duo-name" class="player-name" hidden></strong>
        <span id="invite-label" class="invite-label">Inviter</span>
        <div id="duo-roles" class="role-slots" role="group" aria-label="Rôles du partenaire" hidden>
          <div id="duo-primary-role" class="role-slot"><img src="assets/roles/unselected.png" alt="Principal : non sélectionné" /></div>
          <div id="duo-secondary-role" class="role-slot secondary-slot"><img src="assets/roles/unselected.png" alt="Secondaire : non sélectionné" /></div>
        </div>
      </div>

      <div id="party-slots" class="party-slots" hidden></div>
    </div>

    <div id="arena-grid" class="arena-grid" aria-label="Autres équipes Arena" hidden></div>

    <section id="champ-select" class="champ-select" aria-label="Sélection des champions" hidden>
      <div class="cs-timer" aria-hidden="true"><span id="cs-timer-fill"></span></div>
      <div id="cs-body" class="cs-body">
        <div class="cs-side allies">
          <div id="cs-allies" class="cs-team"></div>
          <div id="cs-bans-mine" class="cs-bans"></div>
        </div>
        <div class="cs-picker">
          <div id="cs-filters" class="cs-filters">
            <div id="cs-roles" class="cs-roles" role="group" aria-label="Filtrer par rôle"></div>
            <input id="cs-search" placeholder="Rechercher" aria-label="Rechercher un champion" maxlength="30" autocomplete="off" />
          </div>
          <div id="cs-grid" class="cs-grid" role="group" aria-label="Champions"></div>
          <div id="cs-aram" class="cs-aram" hidden>
            <div class="cs-aram-main">
              <span id="cs-aram-portrait" class="cs-aram-portrait"></span>
              <div class="cs-aram-text"><span class="cs-title">Ton champion</span><b id="cs-aram-name">—</b><button id="cs-reroll" class="cs-reroll">Relancer</button></div>
            </div>
            <span class="cs-title">Banc · clique pour échanger</span>
            <div id="cs-bench" class="cs-bench"></div>
          </div>
        </div>
        <div id="cs-enemy-side" class="cs-side enemies">
          <div id="cs-enemies" class="cs-team"></div>
          <div id="cs-bans-theirs" class="cs-bans"></div>
        </div>
      </div>
      <div id="cs-swap" class="cs-swap" role="alert" hidden>
        <span id="cs-swap-text"></span>
        <button id="cs-swap-decline" class="invite-decline" aria-label="Refuser l'échange" title="Refuser"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
        <button id="cs-swap-accept" class="invite-accept" aria-label="Accepter l'échange" title="Accepter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      </div>
      <div class="cs-footer">
        <div id="cs-pick" class="cs-pick">
          <span id="cs-pick-portrait" class="cs-pick-portrait"></span>
          <span class="cs-pick-text"><b id="cs-pick-name">Aucun champion</b><small id="cs-pick-sub"></small></span>
        </div>
        <button id="cs-spell1" class="cs-spell" aria-label="Changer le sort 1"></button>
        <button id="cs-spell2" class="cs-spell" aria-label="Changer le sort 2"></button>
        <button id="cs-runes" class="cs-runes" aria-label="Runes"><span>Runes</span></button>
        <button id="cs-action" class="cs-action" disabled>Choisis ton champion</button>
      </div>
    </section>

    <button id="play" class="primary play" disabled>Lancement de League…</button>

    <section id="runes-panel" class="panel runes-panel" role="dialog" aria-labelledby="runes-title" hidden>
      <div class="panel-header">
        <div class="panel-title"><h2 id="runes-title">Runes</h2><span id="runes-sub" class="panel-sub"></span></div>
        <div class="rune-page-picker">
          <button id="rune-page-button" class="rune-page-button" aria-haspopup="listbox" aria-expanded="false"><span id="rune-page-label">Pages</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg></button>
          <div id="rune-pages" class="rune-pages" role="listbox" aria-label="Pages de runes" hidden></div>
        </div>
        <button id="close-runes" aria-label="Fermer les runes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <div id="rune-recos" class="rune-recos" role="group" aria-label="Runes recommandées"></div>
      <div class="rune-editor">
        <div id="rune-primary-col" class="rune-col"><div id="rune-primary-styles" class="rune-styles" role="group" aria-label="Arbre principal"></div><div id="rune-primary" class="rune-tree"></div></div>
        <div id="rune-secondary-col" class="rune-col"><div id="rune-secondary-styles" class="rune-styles" role="group" aria-label="Arbre secondaire"></div><div id="rune-secondary" class="rune-tree"></div><div id="rune-shards" class="rune-tree shards"></div></div>
      </div>
      <div id="rune-info" class="rune-info" aria-live="polite"></div>
      <div class="rune-footer">
        <input id="rune-name" maxlength="25" aria-label="Nom de la page" autocomplete="off" />
        <span id="rune-hint" class="rune-hint"></span>
        <button id="rune-save" class="rune-save" disabled>Enregistrer</button>
      </div>
    </section>

    <section id="spells-panel" class="panel spells-panel" role="dialog" aria-labelledby="spells-title" hidden>
      <div class="panel-header">
        <div class="panel-title"><h2 id="spells-title">Sort 1</h2><span class="panel-sub">Sorts autorisés dans ce mode</span></div>
        <button id="close-spells" aria-label="Fermer le choix des sorts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <div id="spell-options" class="spell-options" role="group" aria-labelledby="spells-title"></div>
    </section>

    <section id="queue-panel" class="panel queue-panel" role="dialog" aria-labelledby="queue-title" hidden>
      <div class="panel-header">
        <div class="panel-title"><h2 id="queue-title">Mode de jeu</h2><span class="panel-sub">Modes ouverts dans ton client</span></div>
        <button id="close-queues" aria-label="Fermer le choix de la file"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <div id="queue-options" class="queue-options" role="group" aria-labelledby="queue-title"><p class="empty-list">Chargement…</p></div>
    </section>

    <section id="roles-panel" class="panel roles-panel" role="dialog" aria-labelledby="role-picker-title" hidden>
      <div class="panel-header">
        <div class="panel-title"><h2 id="role-picker-title">Rôle principal</h2><span id="role-step" class="panel-sub">Étape 1 sur 2</span></div>
        <button id="close-roles" aria-label="Fermer le choix des rôles"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
      </div>
      <div id="role-options" class="role-options" role="group" aria-labelledby="role-picker-title"></div>
    </section>

    <section id="invitations" class="panel friends-panel" role="dialog" aria-labelledby="friends-title" hidden>
      <div class="panel-header">
        <div class="panel-title"><h2 id="friends-title">Inviter un ami</h2><span id="friends-count" class="panel-sub">Amis connectés</span></div>
        <div class="panel-actions">
          <button id="refresh-friends" title="Actualiser" aria-label="Actualiser les amis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg></button>
          <button id="close-friends" title="Fermer" aria-label="Fermer les invitations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
        </div>
      </div>
      <form id="invite-form"><input id="friend-name" placeholder="Pseudo#TAG" aria-label="Pseudo ou Riot ID" maxlength="100" required /><button id="invite" type="submit" aria-label="Envoyer l'invitation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></form>
      <div id="friend-list" class="friend-list" tabindex="0" aria-label="Amis connectés"><p class="empty-list">Chargement…</p></div>
    </section>
  </main>
  <script src="app.js"></script>
  <script src="champselect.js"></script>
  <script src="runes.js"></script>
</body>
</html>
